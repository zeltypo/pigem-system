<!DOCTYPE html>
<!-- ==========================================================================
     FILE OVERVIEW: Customer Account Sign-In Portal (web/html/login.html)
     PURPOSE: Authenticates customers via Gmail or username with reCAPTCHA protection, lockout defense, and 6-digit OTP password recovery.
     HOSTING: Static cloud frontend served via Vercel with Supabase & /api/*
     ========================================================================== -->

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- IMPORT: Browser tab favicon loaded from Supabase Storage website-assets -->
  <link rel="icon" href="https://wuunqfxyejxwrawtjdrf.supabase.co/storage/v1/object/public/website-assets/black-logo-white-mode.png">
  <title>Customer Login | PIGEM Combined Facilities Support Services</title>

  <!-- IMPORT: Unified PIGEM corporate design system stylesheet (web/style.css) -->
  <link rel="stylesheet" href="../style.css">

  <!-- IMPORT: Google reCAPTCHA v2 client widget script for anti-bot protection -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="public-page">

  <!-- SECTION: Top Navigation Header & Brand Bar -->
  <header class="site-header">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between; height:64px;">
      <a href="index.html" class="btn btn-small">&#8592; Back</a>
      <div style="display:flex; align-items:center; gap:10px;">
        <img data-img="black-logo-white-mode.png" src="https://wuunqfxyejxwrawtjdrf.supabase.co/storage/v1/object/public/website-assets/black-logo-white-mode.png" alt="Logo" onclick="window.location.reload();" style="cursor:pointer; height:38px; width:auto;" title="Click logo to refresh page">
      </div>
    </div>
  </header>

  <!-- SECTION: Main Page Content Container -->
  <main class="auth-page">
    <div class="card auth-card">
      <div class="center">
        <h2>Customer Login</h2>
        <p class="small muted mt" style="margin-top:4px;">Sign in using your username or email</p>
      </div>

      <div id="login-attempt-banner" class="notice bad mt" hidden></div>

      <!-- FORM: Interactive User Input Form -->
      <form class="mt-big" onsubmit="handleLogin(event)" novalidate>
        <div>
          <label for="email">Username or Email</label>
          <input id="email" type="text" autocomplete="username" placeholder="username or yourname@gmail.com">
        </div>

        <div class="mt">
          <div class="row between">
            <label for="password" style="margin:0">Password</label>
            <a href="#" class="small" style="color:var(--red); font-weight:600;" onclick="openForgotModal(); return false;">Forgot Username or Password?</a>
          </div>
          <input id="password" type="password" class="mt" placeholder="Enter your password">
        </div>

        <div id="login-recaptcha-wrap" style="display:flex; justify-content:center; margin:16px 0; min-height:78px;">
          <div id="login-captcha-box" style="min-width:304px; min-height:78px;"></div>
        </div>

        <div class="mt-big">
          <button id="btn-login" type="submit" class="btn btn-red btn-full">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <!-- INLINE SCRIPT: Portal configuration and interactive handlers -->
  <script>
window.SYSTEM = "customer";
  </script>

  <!-- IMPORT: Supabase JavaScript SDK v2 for PostgreSQL queries and Cloud Storage -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- IMPORT: Global config, input validators (18+, letters-only name, mobile), Enter-key flow, and popups -->
  <script src="../js/config.js"></script>

  <!-- IMPORT: Cloud database & storage layer (username-only staff auth, QR session storage, CRUD & audit logs) -->
  <script src="../js/db.js"></script>

  <!-- IMPORT: Serverless Python FastAPI client (/api/*) for captcha verification, ID screening & Gmail SMTP emails -->
  <script src="../js/api.js"></script>

  <!-- IMPORT: Role-based authentication controller for Customers, Staff (username-only), and Admin -->
  <script src="../js/login.js"></script>
</body>
</html>
