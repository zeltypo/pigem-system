<!DOCTYPE html>
<!-- ==========================================================================
     FILE OVERVIEW: System Administrator Sign-In Portal (web/html/admin-login.html)
     PURPOSE: Dedicated high-security username-only sign-in gateway for the single System Administrator account (no wrong-password lockout).
     HOSTING: Static cloud frontend served via Vercel with Supabase & /api/*
     ========================================================================== -->

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- IMPORT: Browser tab favicon loaded from Supabase Storage website-assets -->
  <link rel="icon" href="https://wuunqfxyejxwrawtjdrf.supabase.co/storage/v1/object/public/website-assets/black-logo-white-mode.png">
  <title>Admin Login | Combined Facilities Support Services</title>

  <!-- IMPORT: Unified PIGEM corporate design system stylesheet (web/style.css) -->
  <link rel="stylesheet" href="../style.css">

  <!-- IMPORT: Google reCAPTCHA v2 client widget script for anti-bot protection -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <!-- SECTION: Top Navigation Header & Brand Bar -->
  <header class="simple-bar">
    <div class="container" style="display:flex; align-items:center; gap:12px;">
      <img data-img="black-logo-white-mode.png" src="https://wuunqfxyejxwrawtjdrf.supabase.co/storage/v1/object/public/website-assets/black-logo-white-mode.png" alt="Logo" onclick="window.location.reload();" style="cursor:pointer; height:38px; width:auto;" title="Click logo to refresh page">
      <span style="font-weight:700; font-size:16px; cursor:default; user-select:none;">Combined Facilities Support Services</span>
    </div>
  </header>

  <!-- SECTION: Main Page Content Container -->
  <main class="auth-page">
    <div class="card auth-card">
      <div class="center">
        <h2>Admin Login</h2>
        <p class="small muted mt" style="margin-top:4px;">Sign in to Technical Management System</p>
      </div>

      <div id="admin-provision-box" class="notice mt" hidden>
        <b style="display:block; margin-bottom:4px;">First-Time System Setup</b>
        No System Administrator account has been provisioned yet. Register the single Administrator account first to initialize internal accounts.
        <div class="mt">
          <a href="setup-accounts.html" class="btn btn-dark btn-full btn-small">Provision Admin Account &rarr;</a>
        </div>
      </div>

      <div id="login-attempt-banner" class="notice bad mt" hidden></div>

      <!-- FORM: Interactive User Input Form -->
      <form class="mt-big" onsubmit="handleLogin(event)">
        <div>
          <label for="email">Administrator Username</label>
          <input id="email" type="text" autocomplete="username" placeholder="Enter admin username (e.g. pigem_admin)" required>
        </div>

        <div class="mt">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" required>
        </div>

        <div class="row between mt" style="align-items:center;">
          <label class="check" style="margin:0; font-weight:500; font-size:13px;">
            <input id="remember-me" type="checkbox">
            <span>Remember me</span>
          </label>
        </div>

        <div id="login-recaptcha-wrap" style="display:flex; justify-content:center; margin:16px 0; min-height:78px;">
          <div id="login-captcha-box" style="min-width:304px; min-height:78px;"></div>
        </div>

        <div class="mt-big">
          <button id="btn-login" type="submit" class="btn btn-red btn-full">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <!-- INLINE SCRIPT: Portal configuration and interactive handlers -->
  <script>
window.SYSTEM = "admin";
  </script>

  <!-- IMPORT: Supabase JavaScript SDK v2 for PostgreSQL queries and Cloud Storage -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- IMPORT: Global config, input validators (18+, letters-only name, mobile), Enter-key flow, and popups -->
  <script src="../js/config.js"></script>

  <!-- IMPORT: Cloud database & storage layer (username-only staff auth, QR session storage, CRUD & audit logs) -->
  <script src="../js/db.js"></script>

  <!-- IMPORT: Serverless Python FastAPI client (/api/*) for captcha verification, ID screening & Gmail SMTP emails -->
  <script src="../js/api.js"></script>

  <!-- IMPORT: Role-based authentication controller for Customers, Staff (username-only), and Admin -->
  <script src="../js/login.js"></script>
</body>
</html>
