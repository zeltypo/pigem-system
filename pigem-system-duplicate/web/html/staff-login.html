<!DOCTYPE html>
<!-- ==========================================================================
     FILE OVERVIEW: Internal Staff Sign-In Page (web/staff-login.html)
     PURPOSE: Authenticates Verification Agents and the Operations Manager using
              their Username or Official Email (@pigem.ph) and Remember Me.
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- IMPORT: Browser tab favicon displaying the official PIGEM corporate logo -->
  <link rel="icon" href="https://wuunqfxyejxwrawtjdrf.supabase.co/storage/v1/object/public/website-assets/black-logo-white-mode.png">
  <title>Internal Login | Combined Facilities Support Services</title>
  <!-- IMPORT: Unified PIGEM corporate design system stylesheet -->
  <link rel="stylesheet" href="../style.css">
  <!-- IMPORT: Google reCAPTCHA v2 client script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <!-- Simple Top Bar -->
  <header class="simple-bar">
    <div class="container" style="display:flex; align-items:center; gap:12px;">
      <img data-img="black-logo-white-mode.png" src="https://wuunqfxyejxwrawtjdrf.supabase.co/storage/v1/object/public/website-assets/black-logo-white-mode.png" alt="Logo" onclick="window.location.reload();" style="cursor:pointer; height:38px; width:auto;" title="Click logo to refresh page">
      <span style="font-weight:700; font-size:16px; cursor:default; user-select:none;">Combined Facilities Support Services</span>
    </div>
  </header>

  <!-- Main Sign-In Card -->
  <main class="auth-page">
    <div class="card auth-card">
      <div class="center">
        <h2>Internal Login</h2>
        <p class="small muted mt" style="margin-top:4px;">Sign in to Application Management System</p>
      </div>

      <form class="mt-big" onsubmit="handleLogin(event)">
        <div>
          <label for="email">Username or Email</label>
          <input id="email" type="text" autocomplete="username" placeholder="username or name@pigem.ph" required>
        </div>

        <div class="mt">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" required>
        </div>

        <div class="row between mt" style="align-items:center;">
          <label class="check" style="margin:0; font-weight:500; font-size:13px;">
            <input id="remember-me" type="checkbox">
            <span>Remember me</span>
          </label>
        </div>

        <div id="login-recaptcha-wrap" style="display:flex; justify-content:center; margin:16px 0; min-height:78px;">
          <div id="login-captcha-box" style="min-width:304px; min-height:78px;"></div>
        </div>

        <div class="mt-big">
          <button id="btn-login" type="submit" class="btn btn-red btn-full">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <script>
window.SYSTEM = "staff";
  </script>
  <!-- IMPORT: Official Supabase JavaScript SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- IMPORT: Global cloud configuration and UI helpers -->
  <script src="../js/config.js"></script>
  <!-- IMPORT: Cloud database & authentication layer -->
  <script src="../js/db.js"></script>
  <!-- IMPORT: Cloud backend service client -->
  <script src="../js/api.js"></script>
  <!-- IMPORT: Unified sign-in controller -->
  <script src="../js/login.js"></script>
</body>
</html>
