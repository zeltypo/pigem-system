<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications - PIGEM Customer Portal</title>

  <link rel="icon" type="image/png" href="/api/assets/black-logo-white-mode.png" />

  <link rel="stylesheet" href="../style.css" />
</head>
<body class="customer-portal">

  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand" style="display:flex; align-items:center; gap:10px;">
        <img src="/api/assets/black-logo-white-mode.png" alt="PIGEM"  />
        <div><b style="cursor:default; user-select:none;">Combined Facilities Support Services</b></div>
      </div>

      <nav class="customer-nav" aria-label="Customer portal">
        <button id="notif-btn" type="button" class="btn btn-outline btn-sm" onclick="toggleNotifModal()" aria-controls="notif-modal" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> <span id="notif-count" class="badge badge-red hidden">0</span>
        </button>
        <button id="avatar-btn" type="button" class="avatar-btn" onclick="toggleProfileDrawer()" aria-controls="profile-drawer" aria-label="Account settings">CU</button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container" style="padding:32px 20px 64px">
    <div class="customer-overview">
      <h1>Application overview</h1>
      <dl id="cust-app-status-counts" class="customer-status-counts" aria-label="Application status summary"></dl>
    </div>
    <section id="my-applications" class="card" aria-labelledby="customer-applications-title">
      <h2 id="customer-applications-title">My Applications</h2>
      <div id="cust-app-list" class="mt"></div>
    </section>
  </main>

  <div id="notif-modal" class="modal hidden">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
        <h3>My Notifications</h3>
        <button type="button" class="btn btn-outline btn-sm" onclick="toggleNotifModal()">Close</button>
      </div>
      <div id="notif-list"></div>
    </div>
  </div>

  <div id="profile-drawer" class="drawer hidden">
    <div class="drawer-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
        <b>Customer Account</b>
        <button type="button" class="btn btn-outline btn-sm" onclick="toggleProfileDrawer()">Close</button>
      </div>
      <div id="profile-drawer-body">
        <div style="margin-top:10px; padding-bottom:14px; border-bottom:1px solid var(--line)">
          <div style="font-size:12px; font-weight:700; margin-bottom:8px">Edit Profile</div>
          <div id="prof-msg" class="msg"></div>
          <div class="field"><label>Display Name</label><input id="prof-name" type="text" placeholder="Full Name" /></div>
          <div class="field"><label>Username</label><input id="prof-username" type="text" minlength="3" maxlength="30" placeholder="username" /></div>
          <div class="field"><label>Short Bio</label><input id="prof-intro" type="text" placeholder="Add a short bio or note" /></div>
          <div class="field"><label>Profile Photo</label><input id="prof-photo" type="file" accept="image/*" onchange="onProfilePhotoPick(this)" /></div>
          <button type="button" class="btn btn-dark btn-sm" style="width:100%" onclick="saveProfileChanges()">Save Profile</button>
        </div>
        <div style="margin-top:14px; padding-bottom:14px; border-bottom:1px solid var(--line)">
          <div style="font-size:12px; font-weight:700; margin-bottom:8px">Change Password</div>
          <div id="prof-pw-msg" class="msg"></div>
          <div class="field"><label for="prof-pw-current">Current Password</label><input id="prof-pw-current" type="password" autocomplete="current-password" required placeholder="Enter current password" /></div>
          <div class="field"><label for="prof-pw-new">New Password</label><input id="prof-pw-new" type="password" autocomplete="new-password" required data-pw-check="1" placeholder="Strong new password" /></div>
          <div class="field"><label for="prof-pw-confirm">Confirm New Password</label><input id="prof-pw-confirm" type="password" autocomplete="new-password" required placeholder="Enter new password again" /></div>
          <button type="button" class="btn btn-red btn-sm" style="width:100%" onclick="confirmDirectProfilePassword()">Update Password</button>
        </div>
        <div style="margin-top:16px">
          <a href="index.html" target="_blank" rel="noopener" class="btn btn-outline" style="width:100%; margin-bottom:8px; display:inline-flex; align-items:center; justify-content:center;">Open Main Website</a>
          <button type="button" class="btn btn-red" style="width:100%" onclick="confirmDashboardSignOut()">Sign Out</button>
        </div>
      </div>
    </div>
  </div>

  <script>
window.SYSTEM = "customer";
</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/api/config.js"></script>
  <script src="../js/config.js"></script>

  <script src="../js/db.js"></script>

  <script src="../js/api.js"></script>

  <script src="../js/dash-ui.js"></script>

  <script src="../js/phone-transfer.js"></script>
  <script src="../js/customer.js"></script>
  <script src="../js/back-to-top.js"></script>
</body>
</html>
